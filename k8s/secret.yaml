apiVersion: v1
kind: Secret
metadata:
  name: dispatch-secrets
  namespace: dispatch
  labels:
    app.kubernetes.io/name: dispatch
type: Opaque
stringData:
  # Replace with actual values before deploying.
  # In production, use a secrets manager (AWS Secrets Manager, Vault, etc.)
  DATABASE_URL: "postgres://postgres:postgres@postgres:5432/dispatch?sslmode=disable"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_BROKERS: "kafka:9092"
