global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  # dispatch-api: HTTP API service (events + subscriptions)
  # Stateless, scales horizontally without partition constraint.
  - job_name: 'dispatch-api'
    static_configs:
      - targets: ['dispatch-api:8080']
    metrics_path: /metrics

  # dispatch-worker: Kafka consumer + retry poller
  # Scales up to the number of Kafka partitions (12).
  - job_name: 'dispatch-worker'
    static_configs:
      - targets: ['dispatch-worker:8081']
    metrics_path: /metrics

  # kafka-exporter: Consumer group lag and topic/partition metrics.
  # Key metric: kafka_consumergroup_lag{consumergroup, topic, partition}
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
    metrics_path: /metrics
